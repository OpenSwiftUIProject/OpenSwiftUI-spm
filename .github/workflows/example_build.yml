name: Example Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  example_build:
    name: Build Example (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS Simulator"
          - platform: macOS
            destination: "platform=macOS"
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Setup Xcode
        uses: OpenSwiftUIProject/setup-xcode@v2
        with:
          xcode-version: "26.6"
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
      - name: Setup Example
        run: ./Example/setup.sh
      - name: Build
        run: |
          cd Example
          set -o pipefail
          mise exec -- tuist xcodebuild build \
            -workspace Example.xcworkspace \
            -scheme Example-Workspace \
            -destination "${{ matrix.destination }}" \
            2>&1 | xcbeautify --renderer github-actions --preserve-unbeautified
